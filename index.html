<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050914">
<title>Ember Guard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M12 2c.6 3.600 5.600 6 5.600 11.600a5.600 5.600 0 0 1-11.200 0c0-2.600 1.200-4.200 2.600-5.700.3 1.700 1 2.400 2 2.600C11 7 11.500 4.600 12 2z' fill='%23ff9d3b'/%3E%3C/svg%3E">
</head>
<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="fxDark"></div><div id="fxHurt"></div><div id="fxDawn"></div><div id="fxFlash"></div>
  <div id="dns"></div>
  <div id="hud" class="off">
    <div id="hl">
      <div id="firebox"><span class="fic" id="fireIc"></span>
        <div class="fcol"><div class="bar fire"><i id="firefill"></i><b id="firetxt">FIRE 100%</b></div>
        <div class="flight"><span id="lightR">LIGHT 9.5 m</span><span id="fireWarn">FIRE LOW</span></div></div>
      </div>
      <div id="lsb" class="off"></div>
    </div>
    <div id="hc"><div id="timer">00:00</div><div id="wave">WAVE 1/5</div><div id="pace"></div></div>
    <div id="hr"><div class="pill" id="killp"><span id="killIc"></span><b id="killN">0</b></div><div class="pill" id="coins"><span id="coinIc"></span><b id="coinN">0</b></div><button id="btnPause" class="ib" aria-label="Pause">II</button></div>
    <div id="qhud" class="off"></div>
    <div id="streak"><b id="stN">0</b><span id="stT"></span><div id="stBar"><i></i></div></div>
    <div id="comboEnd"></div>
    <div id="bossbar" class="off"><div class="bn"><span id="bossName">THE HOLLOW STAG</span><em id="bossPh">PHASE 1 / 3</em></div><div class="bar boss"><i id="bossfill"></i><u style="left:33%"></u><u style="left:66%"></u></div></div>
    <div id="dock">
      <div id="evohint"></div>
      <div id="slots"></div>
      <div class="bar hp" id="hpbar"><i id="hpghost"></i><i id="hpfill"></i><span class="hic" id="hpIc"></span><b id="hptxt">100 / 100</b></div>
      <div id="xprow"><div id="lvlb"><small>LV</small><span id="lvl">1</span></div><div class="bar xp" id="xpbar"><i id="xpfill"></i><b id="xptxt"></b></div></div>
    </div>
    <div id="dmgdir"><i></i></div>
    <div id="hint"></div>
    <div id="banner"></div>
  </div>
  <div id="joy"><div class="jb"><div class="jk"></div></div></div>
  <div id="confetti"></div>
  <div id="start" class="screen off"></div>
  <div id="modal" class="screen off"><div id="modalBody"></div></div>
  <div id="fatal" class="off"></div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
